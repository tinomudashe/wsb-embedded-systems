# /etc/nginx/sites-available/wsb
limit_req_zone $binary_remote_addr zone=wsb_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=wsb_api:10m   rate=120r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP (port 80):
# - Keeps /api/ingest and /api/device/config open on plain HTTP for the ESP32
# - Redirects browser visitors (http://164.92.227.240/) to the HTTPS domain
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name wsbmerito.telemetry.164-92-227-240.sslip.io wsbmerito.telemetry.project.com _;

    client_max_body_size 512k;
    server_tokens off;

    location /api/ingest {
        limit_req zone=wsb_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000/api/ingest;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/device/ {
        limit_req zone=wsb_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000/api/device/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only the device-key authenticated POST ride upload is exempt from the
    # HTTPS redirect. Regex locations are evaluated before the ordinary
    # `location /` prefix, so this wins for the upload URL; non-POST requests
    # (e.g. session-authenticated ride listing) still go to HTTPS.
    location ~ ^/api/devices/[^/]+/rides$ {
        if ($request_method != POST) {
            return 301 https://$host$request_uri;
        }

        client_max_body_size 6m;
        limit_req zone=wsb_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://wsbmerito.telemetry.164-92-227-240.sslip.io$request_uri;
    }
}

# HTTPS (port 443): Trusted Let's Encrypt TLS certificate
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name wsbmerito.telemetry.164-92-227-240.sslip.io wsbmerito.telemetry.project.com _;

    ssl_certificate     /etc/letsencrypt/live/wsbmerito.telemetry.164-92-227-240.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wsbmerito.telemetry.164-92-227-240.sslip.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 512k;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location = /api/auth/login {
        limit_req zone=wsb_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Browser ride uploads/API calls; allow the same CSV body cap as plain HTTP.
    location /api/devices/ {
        client_max_body_size 6m;
        limit_req zone=wsb_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location / {
        limit_req zone=wsb_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
