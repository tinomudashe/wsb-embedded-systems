# Authenticated local broker for LAN/firmware testing (docker-compose.lan.yml).
# Mirrors the production ACL model but with container-local config paths.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice

max_keepalive 120
max_packet_size 16384
