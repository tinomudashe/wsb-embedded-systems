# Local development broker (NOT for production).
# Production uses deploy/mosquitto-wsb.conf with password_file + ACL.
# Bound to loopback by docker-compose.yml; see docker-compose.lan.yml for the
# authenticated LAN override.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice

max_keepalive 120
max_packet_size 16384
